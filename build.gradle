plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Solo desarrollo: abre el mundo "test", monta una escena con trajes, hace capturas y cierra.
        autotest {
            client()
            systemProperty 'fiskcompat.autotest', 'true'
            systemProperty 'fiskcompat.autotest.suits', System.getProperty('suits', 'sind:mark2,sind:mark3,sind:mark5,sind:mark7,sind:mark42,sind:mark43,sind:mark46,sind:mark50')
            programArguments.addAll('--quickPlaySingleplayer', 'test', '--width', '1280', '--height', '720')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Motor JavaScript (el mismo que usaba Fisk en Java 8, ahora como librería aparte)
    implementation "org.openjdk.nashorn:nashorn-core:${nashorn_version}"
    jarJar("org.openjdk.nashorn:nashorn-core:[${nashorn_version},)") { version { prefer nashorn_version } }
    additionalRuntimeClasspath "org.openjdk.nashorn:nashorn-core:${nashorn_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'fiskcompat.testGameDir', System.getProperty('fiskcompat.testGameDir', "${rootDir}/../testgame")
    testLogging { showStandardStreams = true }
    onlyIf { file(System.getProperty('fiskcompat.testGameDir', "${rootDir}/../testgame")).exists() }
}
